server.port=${PORT:8080}

# Em producao, DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD vem de
# variaveis de ambiente configuradas no provedor de deploy. Em desenvolvimento
# local, os valores depois de ":" abaixo sao usados automaticamente - basta
# ter um MySQL local com o schema.sql aplicado (usuario root sem senha).
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/coffeeshop_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver