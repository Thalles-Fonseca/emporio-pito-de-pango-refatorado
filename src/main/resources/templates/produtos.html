<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>Produtos - Empório Pito de Pango</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>

        <header th:replace="~{fragments/topo-loja :: topo}"></header>

        <main class="secao">
            <h1 th:text="${categoriaAtual != null and !categoriaAtual.isEmpty()} ? 'Catálogo — ' + ${categoriaAtual} : 'Catálogo de Produtos'">Catálogo de Produtos</h1>

            <a th:if="${categoriaAtual != null and !categoriaAtual.isEmpty()}"
               th:href="@{/produtos}" class="btn btn-secundario">Ver todos os produtos</a>

            <p class="mensagem-info" th:if="${mensagem}" th:text="${mensagem}"></p>
            <p class="mensagem-erro" th:if="${erro}" th:text="${erro}"></p>

            <div class="acoes-pagina" sec:authorize="hasAnyRole('GERENTE','FINANCEIRO','ATENDENTE')">
                <a class="btn" th:href="@{/produtos/novo}">Novo Produto</a>
            </div>

            <div class="produtos-grid">
                <div class="card-produto" th:each="produto : ${produtos}">
                    <div class="imagem-produto">
                        <img th:src="@{'/img/' + ${produto.imagemUrl}}" th:alt="${produto.nome}">

                    </div>

                    <h3 th:text="${produto.nome}">Nome do Produto</h3>
                    <p th:text="${produto.categoria}">Categoria</p>
                    <strong th:text="'R$ ' + ${produto.valor}">R$ 00,00</strong>

                    <form th:if="${produto.quantidade > 0}"
                          th:action="@{/carrinho/adicionar}" method="post" class="form-adicionar-carrinho">
                        <input type="hidden" name="codigo" th:value="${produto.codigo}">
                        <input type="number" name="quantidade" value="1" min="1" th:max="${produto.quantidade}">
                        <button type="submit" class="btn">Adicionar ao carrinho</button>
                    </form>
                    <p th:unless="${produto.quantidade > 0}" class="mensagem-erro">Esgotado</p>

                    <div class="acoes-card" sec:authorize="hasAnyRole('GERENTE','FINANCEIRO','ATENDENTE')">
                        <!-- DELETE CORRIGIDO -->
                        <a class="btn"
                           th:href="@{/produtos/excluir/{codigo}(codigo=${produto.codigo})}"
                           onclick="return confirm('Deseja excluir este produto?')">
                            Excluir
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <img th:src="@{/img/LogoPitodePango.png}" alt="Logo">
            <p>Empório Pito de Pango — Seu café, sua vibe, seu ritual.</p>
            <p>© 2026 Todos os direitos reservados.</p>
        </footer>

        <script th:src="@{/js/produtos.js}"></script>
        <div th:replace="~{fragments/rodape-loja :: rodape}"></div>
    </body>
</html>
