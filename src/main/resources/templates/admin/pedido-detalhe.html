<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Pedido - Painel administrativo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header th:replace="~{admin/fragments/topo :: topo}"></header>

<main class="admin-container">
    <h1>Pedido nº <span th:text="${pedido.numeroPedido}"></span></h1>

    <table class="tabela-admin">
        <tbody>
        <tr>
            <th>Cliente</th>
            <td th:text="${pedido.nomeCliente}"></td>
        </tr>
        <tr>
            <th>Data</th>
            <td th:text="${pedido.dataPedido}"></td>
        </tr>
        <tr>
            <th>Produto</th>
            <td th:text="${pedido.produto}"></td>
        </tr>
        <tr>
            <th>Valor unitário</th>
            <td th:text="'R$ ' + ${pedido.valorUnitario}"></td>
        </tr>
        <tr>
            <th>Quantidade</th>
            <td th:text="${pedido.quantidade}"></td>
        </tr>
        <tr>
            <th>Total</th>
            <td th:text="'R$ ' + ${pedido.total}"></td>
        </tr>
        </tbody>
    </table>

    <div class="acoes-pagina">
        <a th:href="@{/admin/pedidos}" class="btn btn-secundario">Voltar</a>
        <a class="btn" style="background: var(--vermelho);" sec:authorize="hasAnyRole('GERENTE','FINANCEIRO')"
           th:href="@{/admin/pedidos/excluir/{numero}(numero=${pedido.numeroPedido})}"
           onclick="return confirm('Deseja excluir este pedido?')">Excluir</a>
    </div>
</main>

</body>
</html>
