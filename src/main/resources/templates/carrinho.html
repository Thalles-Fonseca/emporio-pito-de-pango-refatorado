<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carrinho - Empório Pito de Pango</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>

        <header th:replace="~{fragments/topo-loja :: topo}"></header>

        <main class="secao">
            <h1>Meu Carrinho</h1>

            <p class="mensagem-info" th:if="${mensagem}" th:text="${mensagem}"></p>
            <p class="mensagem-erro" th:if="${erro}" th:text="${erro}"></p>

            <div class="carrinho-container" th:unless="${itens.isEmpty()}">
                <section class="lista-carrinho">
                    <div class="item-carrinho" th:each="item : ${itens}">
                        <div class="img-carrinho">Img</div>

                        <div>
                            <h3 th:text="${item.nome}">Produto</h3>
                            <strong th:text="'R$ ' + ${item.valorUnitario}">R$ 0,00</strong>
                        </div>

                        <form th:action="@{/carrinho/alterar/{codigo}(codigo=${item.codigoProduto})}"
                              method="post" class="quantidade-box">
                            <input type="number" name="quantidade" th:value="${item.quantidade}" min="1" style="width:60px">
                            <button type="submit" class="btn btn-secundario">Atualizar</button>
                        </form>

                        <a class="btn-remover" th:href="@{/carrinho/remover/{codigo}(codigo=${item.codigoProduto})}">Remover</a>
                    </div>

                    <a th:href="@{/produtos}" class="btn btn-secundario">Continuar comprando</a>
                </section>

                <aside class="resumo-carrinho">
                    <h2>Resumo do pedido</h2>
                    <p>Total: <strong th:text="'R$ ' + ${total}">R$ 0,00</strong></p>
                    <a th:href="@{/carrinho/finalizar}" class="btn">Finalizar pedido</a>
                </aside>
            </div>

            <div th:if="${itens.isEmpty()}">
                <p>Seu carrinho está vazio.</p>
                <a th:href="@{/produtos}" class="btn">Ver produtos</a>
            </div>
        </main>

        <footer>
            <img th:src="@{/img/LogoPitodePango.png}" alt="Logo">
            <p>Empório Pito de Pango — Seu café, sua vibe, seu ritual.</p>
            <p>© 2026 Todos os direitos reservados.</p>
        </footer>

    </body>
</html>
