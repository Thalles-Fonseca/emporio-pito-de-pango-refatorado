## YAML Template.
name: CI - Empório Pito de Pango

on:
  push:
    branches: [ "main", "develop", "emporio-pito-de-pango-web" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build com Maven
        run: mvn clean compile -B --no-transfer-progress

      - name: Rodar Testes Unitários
        run: mvn test -B --no-transfer-progress

      - name: Build JAR (package)
        run: mvn package -DskipTests -B --no-transfer-progress

      - name: Upload Artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: emporio-pito-de-pango-jar
          path: target/*.jar
          retention-days: 7

  # Opcional: Análise de qualidade (pode adicionar SonarQube depois)
  # quality:
  #   runs-on: ubuntu-latest
  #   needs: build-and-test
---
